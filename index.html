    <script>
      (function () {
        var shownError = false;
        var bootTimer = null;

        function isAppAlreadyMounted() {
          if (window.__AATHIRAI_MOUNTED__) return true;
          var root = document.getElementById('root');
          if (!root) return false;
          var bootShell = document.getElementById('aathirai-boot-shell');
          if (!bootShell && root.childElementCount > 0) {
            markMounted();
            return true;
          }
          return false;
        }

        function showBootError(msg) {
          if (isAppAlreadyMounted() || shownError) return;
          shownError = true;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#020617;color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;">' +
              '<div style="max-width:440px;width:100%;background:#0f172a;border:1px solid #334155;border-radius:16px;padding:24px;text-align:center;">' +
                '<div style="font-size:16px;font-weight:800;margin-bottom:8px;">Unable to finish loading view</div>' +
                '<div style="font-size:12px;color:#cbd5e1;word-break:break-word;margin-bottom:16px;" id="aathirai-boot-err-msg"></div>' +
                '<button type="button" onclick="window.location.reload()" style="padding:10px 18px;border-radius:10px;border:none;background:#e11d48;color:#fff;font-weight:700;font-size:12px;cursor:pointer;">Reload Page</button>' +
              '</div>' +
            '</div>';
          var el = document.getElementById('aathirai-boot-err-msg');
          if (el) el.textContent = String(msg || 'Unexpected startup interruption.');
        }

        function isStaleChunkError(msg) {
          return /dynamically imported module|importing a module script|outdated optimize dep|chunkloaderror/i.test(
            String(msg || '')
          );
        }

        function maybeRecoverChunk(msg) {
          if (isStaleChunkError(msg)) {
            try {
              if (!sessionStorage.getItem('aathirai_boot_reload')) {
                sessionStorage.setItem('aathirai_boot_reload', '1');
                window.location.reload();
                return true;
              }
            } catch (e) {}
          }
          return false;
        }

        function onVitePreloadError(ev) {
          if (isAppAlreadyMounted()) return;
          if (!maybeRecoverChunk('vite:preloadError')) {
            showBootError(ev && ev.payload ? ev.payload.message : 'Asset preload failed.');
          }
        }

        function onBootError(ev) {
          if (isAppAlreadyMounted()) return;
          var target = ev && ev.target;
          // Ignore non-fatal resource load failures (images, fonts, stylesheets, external optional scripts)
          if (target && target !== window) {
            var tag = String(target.tagName || '').toUpperCase();
            if (tag !== 'SCRIPT') return;
            var src = String(target.src || '');
            if (!src || src.indexOf(window.location.origin) !== 0) return;
            if (!maybeRecoverChunk('Failed to load script: ' + src)) {
              showBootError('Failed to load application script.');
            }
            return;
          }
          var msg = ev && ev.message ? String(ev.message) : '';
          if (!msg) return;
          // Only handle genuine module/chunk boot failures or fatal uncaught startup errors before mount
          if (isStaleChunkError(msg)) {
            if (!maybeRecoverChunk(msg)) {
              showBootError(msg);
            }
          }
        }

        function onBootRejection(ev) {
          if (isAppAlreadyMounted()) return;
          var reason = ev && ev.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (isStaleChunkError(msg) && !maybeRecoverChunk(msg)) {
            showBootError(msg);
          }
        }

        function markMounted() {
          if (window.__AATHIRAI_MOUNTED__) return;
          window.__AATHIRAI_MOUNTED__ = true;
          if (bootTimer) {
            clearTimeout(bootTimer);
            bootTimer = null;
          }
          window.removeEventListener('vite:preloadError', onVitePreloadError);
          window.removeEventListener('error', onBootError, true);
          window.removeEventListener('unhandledrejection', onBootRejection);
          try {
            sessionStorage.removeItem('aathirai_boot_reload');
          } catch (e) {}
        }

        window.__AATHIRAI_MARK_MOUNTED__ = markMounted;

        window.addEventListener('vite:preloadError', onVitePreloadError);
        window.addEventListener('error', onBootError, true);
        window.addEventListener('unhandledrejection', onBootRejection);

        bootTimer = setTimeout(function () {
          if (isAppAlreadyMounted() || shownError) return;
          var statusEl = document.getElementById('aathirai-boot-status');
          if (statusEl) {
            statusEl.innerHTML =
              'Still loading... <button type="button" onclick="window.location.reload()" style="margin-left:8px;padding:4px 10px;border-radius:6px;border:1px solid #475569;background:#1e293b;color:#f8fafc;font-size:11px;font-weight:700;cursor:pointer;">Reload</button>';
          }
        }, 8000);
      })();
    </script>
